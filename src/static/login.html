<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 观言 WordWatch</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/setup.css"><script defer src="/static/login.js"></script></head>
<body class="setup-body"><main class="setup-main"><a class="brand" href="/">◈ <span>观言<small>WordWatch</small></span></a><section class="panel setup-panel"><div class="eyebrow">WELCOME BACK</div><h1>登录管理页面</h1><p class="hint">使用你创建的管理员账户，继续管理监控项与消息推送。</p><form id="login-form"><label>管理员账户<input name="username" required maxlength="64" autocomplete="username" placeholder="输入管理员账户" autofocus></label><label>密码<input name="password" type="password" required maxlength="256" autocomplete="current-password" placeholder="输入登录密码"></label><p id="login-message" class="auth-message" role="status" hidden></p><button class="primary" type="submit">登录</button></form></section><p class="hint setup-foot">登录状态有效期为 12 小时，可随时主动退出。</p></main></body>
</html>
