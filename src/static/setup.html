<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初始化管理员 · 观言 WordWatch</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/setup.css"><script defer src="/static/setup.js"></script></head>
<body class="setup-body"><main class="setup-main"><a class="brand" href="/"><svg class="brand-icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 10-10 10L2 12 12 2Z"/><path d="m12 7 5 5-5 5-5-5 5-5Z"/></svg> <span>观言<small>WordWatch</small></span></a><section class="panel setup-panel"><div class="eyebrow">WELCOME TO WORDWATCH</div><h1>创建管理员账户</h1><p class="hint">首次启动，只需完成一次初始化。账户信息保存在本地 SQLite，密码以加盐摘要保存。</p><form id="setup-form"><label>管理员账户<input name="username" value="admin" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9_.\-]+" autocomplete="username"><small>3–64 位，支持英文字母、数字、下划线、点和短横线。</small></label><label>管理员密码<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"><small>至少 12 位。</small></label><label>确认密码<input name="confirm_password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><p id="setup-message" role="status" hidden></p><button class="primary" type="submit">创建账户并进入管理页面</button></form><div id="setup-success" hidden><div class="notice">管理员账户已创建。进入管理页面后，使用刚设置的账户与密码登录。</div><a class="primary setup-link" href="/">进入管理页面 <svg class="ui-icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a></div></section><p class="hint setup-foot">初始化完成后，此表单将自动关闭。</p></main></body>
</html>
